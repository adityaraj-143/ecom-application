spring:
  application:
    name: ecom-application
  datasource:
    url: jdbc:postgresql://localhost:5432/aditz
    username: aditz
    password: secretpassword
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: MyNewApp
    description: MyNewApp
    version: 1.0.0